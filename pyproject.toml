[tool.poetry]
name = "langgraph-course"
version = "0.1.0"
description = "Workbook for the LangGraph Framework course on Coursera"
authors = []
readme = "README.md"
packages = [{ include = "langgraph_course", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
langsmith = "^0.3"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
grandalf = "^0.8"
loguru = "^0.7.3"
langgraph = "^1.2.6"
langchain = "^1.3.10"
langchain-community = "^0.4.2"
langchain-openai = "^1.3.2"
fastapi = "^0.138.1"
pymupdf = "^1.27.2.3"

[tool.poetry.group.dev.dependencies]
streamlit = "^1.44"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
