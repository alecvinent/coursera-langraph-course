[tool.poetry]
name = "langgraph-course"
version = "0.1.0"
description = "Workbook for the LangGraph Framework course on Coursera"
authors = []
readme = "README.md"
packages = [{ include = "langgraph_course", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.4"
langchain = "^0.3"
langchain-community = "^0.3"
langchain-core = "^0.3"
langsmith = "^0.3"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
grandalf = "^0.8"
loguru = "^0.7.3"
openai = "^2.43.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
